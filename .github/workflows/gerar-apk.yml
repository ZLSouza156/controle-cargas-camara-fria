name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - 'app/**'
      - 'scripts/**'
      - 'signing/debug.keystore'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/gerar-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK utilizado pelo projeto
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Instalar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar e verificar APK
        id: apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/gerar-apk.sh

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Controle-Cargas-APK
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.apk_path }}.sha256
          if-no-files-found: error
          retention-days: 30
          overwrite: true
